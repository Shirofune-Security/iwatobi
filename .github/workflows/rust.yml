name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        info:
          - { os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu" }
          - { os: "macos-latest", target: "aarch64-apple-darwin" }
          - { os: "windows-latest", target: "x86_64-pc-windows-msvc" }
    runs-on: ${{ matrix.info.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.info.target }}
      - name: Enable Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fmt check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked --target=${{ matrix.info.target }} -- -D warnings
      - name: Build
        run: cargo build --locked --target=${{ matrix.info.target }}
      - name: Build tests
        run: cargo test --no-run --locked --target=${{ matrix.info.target }}
      - name: Run tests
        run: cargo test --locked --target=${{ matrix.info.target }}
